<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img">
<title>From prompt spans to head inputs</title><desc>The protocol is fixed; the number of spans depends on the number of candidates K.</desc>
<rect x="0" y="0" width="1280" height="660" rx="0" fill="#ffffff" stroke="none" stroke-width="1.3"/>
<rect x="48" y="34" width="40" height="30" rx="7" fill="#fdeacc" stroke="none" stroke-width="1.3"/>
<text x="68" y="55" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#9a4d00">05</text>
<text x="104" y="57" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#5a6a80">JEV DECISION HEAD</text>
<text x="48" y="108" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="700" fill="#1a202c">From prompt spans to head inputs</text>
<text x="48" y="140" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#5a6a80">The protocol is fixed; the number of spans depends on the number of candidates K.</text>
<rect x="48" y="228" width="350" height="104" rx="12" fill="#f7f9fb" stroke="#dce3eb" stroke-width="1.3"/>
<text x="223.0" y="275.0" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#1a202c">Prompt spans</text>
<text x="223.0" y="303.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#5a6a80">Stem + K options + decision</text>
<rect x="465" y="228" width="350" height="104" rx="12" fill="#f7f9fb" stroke="#dce3eb" stroke-width="1.3"/>
<text x="640.0" y="275.0" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#1a202c">FP16 archive</text>
<text x="640.0" y="303.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#5a6a80">(K+2) x 2 pools x 6 x 10240</text>
<rect x="882" y="228" width="350" height="104" rx="12" fill="#fdeacc" stroke="#e8850c" stroke-width="1.3"/>
<text x="1057.0" y="275.0" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#9a4d00">Selected head inputs</text>
<text x="1057.0" y="303.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#5a6a80">(K+2) x 2 pools x 5 x 10240</text>
<line x1="398" y1="280" x2="453.0" y2="280.0" stroke="#718096" stroke-width="2.2"/>
<polygon points="465,280 453.0,285.0 453.0,275.0" fill="#718096"/>
<line x1="815" y1="280" x2="870.0" y2="280.0" stroke="#718096" stroke-width="2.2"/>
<polygon points="882,280 870.0,285.0 870.0,275.0" fill="#718096"/>
<rect x="882" y="426" width="350" height="104" rx="12" fill="#eefaf3" stroke="#dce3eb" stroke-width="1.3"/>
<text x="1057.0" y="473.0" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#1a202c">Train-fit z-score</text>
<text x="1057.0" y="501.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#5a6a80">Same frozen mean and scale</text>
<line x1="1057" y1="332" x2="1057.0" y2="414.0" stroke="#718096" stroke-width="2.2"/>
<polygon points="1057,426 1052.0,414.0 1062.0,414.0" fill="#718096"/>
<rect x="48" y="405" width="767" height="132" rx="12" fill="#eef3fb" stroke="none" stroke-width="1.3"/>
<text x="72" y="441" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#5a6a80">HEAD LAYERS</text>
<text x="72" y="475" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start" font-weight="700" fill="#1a202c">23 / 29 / 35 / 41 / last</text>
<text x="72" y="509" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#5a6a80">Archive also retains layer 15. Each tap has 4 streams x 2560.</text>
<line x1="48" y1="563" x2="1232" y2="563" stroke="#dce3eb" stroke-width="1.5"/>
<text x="48" y="590" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#5a6a80">The final decision position follows the complete assistant suffix, not the last option.</text>
<text x="48" y="616" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#5a6a80">The feature tensor is variable in K; changing spans, pooling or layers changes its meaning.</text>
</svg>
