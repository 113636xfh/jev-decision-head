<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img">
<title>One backbone. Two interfaces.</title><desc>A frozen resident model supplies features to a small, separately trained decision head.</desc>
<rect x="0" y="0" width="1280" height="660" rx="0" fill="#ffffff" stroke="none" stroke-width="1.3"/>
<rect x="48" y="34" width="40" height="30" rx="7" fill="#fdeacc" stroke="none" stroke-width="1.3"/>
<text x="68" y="55" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="700" fill="#9a4d00">01</text>
<text x="104" y="57" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#5a6a80">JEV DECISION HEAD</text>
<text x="48" y="108" font-family="Arial, Helvetica, sans-serif" font-size="28" text-anchor="start" font-weight="700" fill="#1a202c">One backbone. Two interfaces.</text>
<text x="48" y="140" font-family="Arial, Helvetica, sans-serif" font-size="17" text-anchor="start" font-weight="400" fill="#5a6a80">A frozen resident model supplies features to a small, separately trained decision head.</text>
<rect x="48" y="224" width="260" height="104" rx="12" fill="#f7f9fb" stroke="#dce3eb" stroke-width="1.3"/>
<text x="178.0" y="271.0" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#1a202c">Decision request</text>
<text x="178.0" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#5a6a80">State + declared options</text>
<rect x="356" y="224" width="260" height="104" rx="12" fill="#f7f9fb" stroke="#dce3eb" stroke-width="1.3"/>
<text x="486.0" y="271.0" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#1a202c">Resident backbone</text>
<text x="486.0" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#5a6a80">One set of frozen weights</text>
<rect x="664" y="224" width="260" height="104" rx="12" fill="#f7f9fb" stroke="#dce3eb" stroke-width="1.3"/>
<text x="794.0" y="271.0" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#1a202c">Multi-layer readout</text>
<text x="794.0" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#5a6a80">Five taps; last + mean</text>
<rect x="972" y="224" width="260" height="104" rx="12" fill="#fdeacc" stroke="#e8850c" stroke-width="1.3"/>
<text x="1102.0" y="271.0" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#9a4d00">13.19 M head</text>
<text x="1102.0" y="299.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#5a6a80">A probability per option</text>
<line x1="308" y1="276" x2="344.0" y2="276.0" stroke="#718096" stroke-width="2.2"/>
<polygon points="356,276 344.0,281.0 344.0,271.0" fill="#718096"/>
<line x1="616" y1="276" x2="652.0" y2="276.0" stroke="#718096" stroke-width="2.2"/>
<polygon points="664,276 652.0,281.0 652.0,271.0" fill="#718096"/>
<line x1="924" y1="276" x2="960.0" y2="276.0" stroke="#718096" stroke-width="2.2"/>
<polygon points="972,276 960.0,281.0 960.0,271.0" fill="#718096"/>
<rect x="356" y="436" width="260" height="104" rx="12" fill="#f7f9fb" stroke="#dce3eb" stroke-width="1.3"/>
<text x="486.0" y="483.0" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#1a202c">Generation API</text>
<text x="486.0" y="511.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#5a6a80">Normal text generation</text>
<line x1="486" y1="328" x2="486.0" y2="424.0" stroke="#718096" stroke-width="2.2"/>
<polygon points="486,436 481.0,424.0 491.0,424.0" fill="#718096"/>
<rect x="972" y="436" width="260" height="104" rx="12" fill="#eefaf3" stroke="#dce3eb" stroke-width="1.3"/>
<text x="1102.0" y="483.0" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle" font-weight="700" fill="#1a202c">Caller-side policy</text>
<text x="1102.0" y="511.0" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" font-weight="400" fill="#5a6a80">Accept / generate / review</text>
<line x1="1102" y1="328" x2="1102.0" y2="424.0" stroke="#718096" stroke-width="2.2"/>
<polygon points="1102,436 1097.0,424.0 1107.0,424.0" fill="#718096"/>
<text x="48" y="197" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="start" font-weight="700" fill="#5a6a80">DECISION PATH</text>
<line x1="48" y1="563" x2="1232" y2="563" stroke="#dce3eb" stroke-width="1.5"/>
<text x="48" y="590" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#5a6a80">Weights are shared; a decision still requires its own readout forward pass.</text>
<text x="48" y="616" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="start" font-weight="400" fill="#5a6a80">The head returns a distribution. Fallback is an optional caller policy, not part of the head.</text>
</svg>
