<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="470" viewBox="0 0 1160 470"><rect width="1160" height="470" fill="#ffffff"/>
<text x="28" y="34" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#111111" text-anchor="start">Where the time goes: the head is milliseconds, the prompt is seconds</text>
<rect x="150.0" y="312.3131133837089" width="116.66666666666666" height="47.686886616291105" rx="3" fill="#1f6feb" stroke="#1f6feb" stroke-width="0"/>
