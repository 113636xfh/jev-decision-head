<text x="1044" y="283" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">3.04 s</text>
<text x="760" y="330" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472" text-anchor="start">231 public items, 149,519 prompt tokens,</text>
<text x="760" y="350" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#5a6472" text-anchor="start">645 s wall clock, one resident process</text>
<text x="40" y="440" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5a6472" text-anchor="start">Essentially all of the channel cost is reading the prompt once. A readout request does not reuse the prefix cache by design (~0.1 s more than a plain chat request at equal length).</text>
