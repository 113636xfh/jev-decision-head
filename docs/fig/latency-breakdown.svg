<text x="208.33333333333331" y="382" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#111111" text-anchor="middle">head only</text>
<rect x="336.66666666666663" y="131.79500284104478" width="116.66666666666666" height="228.20499715895522" rx="3" fill="#c2410c" stroke="#c2410c" stroke-width="0"/>
<text x="394.99999999999994" y="121.79500284104478" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">1.82 s</text>
<text x="394.99999999999994" y="382" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#111111" text-anchor="middle">channel p50</text>
