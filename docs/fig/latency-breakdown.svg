<text x="581.6666666666666" y="80.41191558966472" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#111111" text-anchor="middle">7.10 s</text>
<text x="581.6666666666666" y="382" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="600" fill="#111111" text-anchor="middle">channel p95</text>
<line x1="120" y1="360" x2="680" y2="360" stroke="#111111" stroke-width="1.4"/>
<text x="120" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111" text-anchor="start">per decision, bar height on a log scale (1 ms - 10 s)</text>
<rect x="740" y="110" width="380" height="250" rx="8" fill="#f6f8fa" stroke="#5a6472" stroke-width="1.2"/>
<text x="760" y="140" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#111111" text-anchor="start">Channel latency by tier (p50)</text>
<text x="760" y="191" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111111" text-anchor="start">original</text>
<rect x="880" y="175" width="78" height="22" rx="3" fill="#c2410c" stroke="#c2410c" stroke-width="0"/>
<text x="966" y="191" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">1.52 s</text>
<text x="760" y="237" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111111" text-anchor="start">easy</text>
<rect x="880" y="221" width="80" height="22" rx="3" fill="#c2410c" stroke="#c2410c" stroke-width="0"/>
<text x="968" y="237" font-family="Arial, Helvetica, sans-serif" font-size="12.5" font-weight="400" fill="#111111" text-anchor="start">1.56 s</text>
<text x="760" y="283" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#111111" text-anchor="start">hard</text>
